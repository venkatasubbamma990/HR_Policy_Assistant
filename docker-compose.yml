services:
  hrpolicy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrpolicy-assistant
    restart: unless-stopped
    environment:
      HR_DOCUMENTS_DIR: /app/documents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HR_EMBED_MODEL: ${HR_EMBED_MODEL:-text-embedding-3-small}
      HR_CHAT_MODEL: ${HR_CHAT_MODEL:-gpt-4o-mini}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - ./documents:/app/documents:ro
