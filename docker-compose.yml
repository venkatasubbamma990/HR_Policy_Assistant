services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hrpolicy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrpolicy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrpolicy}
      POSTGRES_DB: ${POSTGRES_DB:-hrpolicy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrpolicy} -d ${POSTGRES_DB:-hrpolicy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hrpolicy:
    profiles:
      - docker-api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrpolicy-assistant
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HR_DOCUMENTS_DIR: /app/documents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      # LM Studio on Windows: run scripts/setup-wsl-llm.ps1 (Admin) first, then set WSL_HOST_IP in .env
      OPENAI_BASE_URL: http://host.docker.internal:${HR_WSL_LLM_PORT:-12345}/v1
      HR_WSL_LLM_DISABLE: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-hrpolicy}:${POSTGRES_PASSWORD:-hrpolicy}@postgres:5432/${POSTGRES_DB:-hrpolicy}?sslmode=disable
      PGVECTOR_COLLECTION: ${PGVECTOR_COLLECTION:-hr_policies}
      HR_EMBED_MODEL: ${HR_EMBED_MODEL:-text-embedding-nomic-embed-text-v1.5}
      HR_EMBED_DIMENSIONS: ${HR_EMBED_DIMENSIONS:-768}
      HR_CHAT_MODEL: ${HR_CHAT_MODEL:-google/gemma-3-12b}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      HR_HTTP_PORT: "8080"
    ports:
      - "${HR_HTTP_PORT:-8081}:8080"
    extra_hosts:
      - "host.docker.internal:${WSL_HOST_IP:-host-gateway}"
    volumes:
      - ./documents:/app/documents:ro

volumes:
  pgdata:
